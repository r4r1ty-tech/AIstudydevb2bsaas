<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#090c0a" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#eceee7" media="(prefers-color-scheme: light)">
  <title>Пульт</title>
  <link rel="preload" href="static/fonts/onest-cyrillic-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="static/fonts/unbounded-cyrillic-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="static/css/tokens.css">
  <link rel="stylesheet" href="static/css/base.css">
  <link rel="stylesheet" href="static/css/layout.css">
  <link rel="stylesheet" href="static/css/components.css">
  <link rel="stylesheet" href="static/css/screens.css">
  <link rel="icon" href="static/img/icon-32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="static/img/icon-192.png" sizes="192x192" type="image/png">
  <link rel="apple-touch-icon" href="static/img/icon-180.png">
  <link rel="manifest" href="static/manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Пульт">
  <script type="module" src="static/js/main.js"></script>
</head>
<body>
  <a class="skip" href="#main">К содержимому</a>

  <div id="gate" class="gate" hidden>
    <form id="login-form" class="gate-card" novalidate>
      <span class="brand-mark" aria-hidden="true"></span>
      <h1 class="gate-title">Пульт</h1>
      <p class="gate-sub">Введите пароль панели.</p>
      <label class="field">
        <span class="field-label">Пароль</span>
        <input id="pw" type="password" name="password" autocomplete="current-password" required>
      </label>
      <p id="gate-msg" class="form-error" role="alert" hidden></p>
      <button type="submit" class="btn btn-primary btn-block">Войти</button>
    </form>
  </div>

  <div id="app" class="app" hidden>
    <nav class="nav" aria-label="Разделы">
      <div class="nav-brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="nav-brand-text">Пульт</span>
      </div>
      <div class="nav-links" id="nav-links"></div>
      <p class="nav-foot" id="nav-foot"></p>
    </nav>
    <main id="main" class="main" tabindex="-1">
      <div id="screen" class="screen"></div>
    </main>
  </div>

  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>
  <noscript><p class="noscript">Для панели нужен включённый JavaScript.</p></noscript>
</body>
</html>
