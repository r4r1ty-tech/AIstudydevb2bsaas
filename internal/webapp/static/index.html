<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Пульт</title>
  <link rel="stylesheet" href="/static/app.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <div id="gate" class="gate">
    <form id="login-form" class="gate-form">
      <input id="pw" type="password" name="password" autocomplete="current-password" placeholder="пароль" required>
      <button type="submit">войти</button>
      <p id="gate-msg" class="gate-err" hidden></p>
    </form>
  </div>
  <div id="app" hidden>
    <header class="top">
      <div>
        <h1>Пульт</h1>
        <p class="sub" id="hdr-meta">SSAU · админ</p>
      </div>
      <span id="poll-st" class="muted">—</span>
    </header>
    <nav class="tabs" role="tablist">
      <button type="button" data-tab="test" class="active">Тест</button>
      <button type="button" data-tab="now">Сейчас</button>
      <button type="button" data-tab="people">Люди</button>
      <button type="button" data-tab="lessons">Пары</button>
      <button type="button" data-tab="parser">Парсер</button>
      <button type="button" data-tab="logs">Логи</button>
    </nav>
    <main>
      <section id="tab-test" class="tab" data-panel="test">
        <div id="test-live" class="live-card" hidden>
          <p class="live-eyebrow">Сейчас тест</p>
          <dl class="live-dl">
            <div><dt>Ссылка</dt><dd id="live-url">—</dd></div>
            <div><dt>Имя в BBB</dt><dd id="live-name">—</dd></div>
            <div><dt>Статус</dt><dd id="live-status">—</dd></div>
            <div><dt>Режим</dt><dd id="live-mode">—</dd></div>
          </dl>
          <button type="button" class="act danger" id="test-leave-live">Выйти</button>
        </div>
        <div id="test-setup">
          <h2>Тестовая комната</h2>
          <p class="muted" id="test-blurb">Отдельная сущность: ссылка и имя живут только тут, на пары не уходят. Зашёл — карточка как на паре, с «Выйти».</p>
          <form id="test-form" class="panel form">
            <label>Ссылка BBB <input id="test-url" name="url" placeholder="https://bbb.ssau.ru/b/…" autocomplete="off"></label>
            <label>Имя в BBB <input id="test-name" name="name" placeholder="тест" autocomplete="off" maxlength="64"></label>
            <div class="actions">
              <button type="submit" class="act" id="test-dummy" data-want="dummy">Болванчик</button>
              <button type="submit" class="act" id="test-listen" data-want="listen">Со звуком</button>
            </div>
          </form>
        </div>
      </section>
      <section id="tab-now" class="tab" data-panel="now" hidden>
        <h2>Аккаунты</h2>
        <div id="now-accounts" class="list"></div>
        <h2>Текущая пара</h2>
        <div id="now-current" class="panel"></div>
        <h2>Следующая</h2>
        <div id="now-next" class="panel"></div>
        <h2>Запись</h2>
        <div id="now-rec" class="panel"></div>
      </section>
      <section id="tab-people" class="tab" data-panel="people" hidden>
        <div id="people-list" class="cards"></div>
      </section>
      <section id="tab-lessons" class="tab" data-panel="lessons" hidden>
        <h2>Расписание</h2>
        <div id="lessons-list" class="list"></div>
        <h2>Ссылки BBB</h2>
        <form id="bbb-form" class="panel form">
          <label>Ключ <input name="key" placeholder="опционально"></label>
          <label>Дисциплина <input name="discipline"></label>
          <label>Преподаватель <input name="teacher"></label>
          <label>URL <input name="url" placeholder="https://bbb.ssau.ru/b/..." required></label>
          <button type="submit">Сохранить ссылку</button>
        </form>
        <div id="bbb-list" class="list"></div>
        <h2>Записи</h2>
        <div id="rec-list" class="list"></div>
      </section>
      <section id="tab-parser" class="tab" data-panel="parser" hidden>
        <div id="parser-box" class="panel"></div>
        <pre id="parser-diff" class="diff"></pre>
        <button type="button" id="btn-refresh">Обновить расписание сейчас</button>
      </section>
      <section id="tab-logs" class="tab" data-panel="logs" hidden>
        <div id="logs-list" class="tape"></div>
      </section>
    </main>
    <div id="toast" class="toast" hidden></div>
  </div>
  <script src="/static/app.js"></script>
</body>
</html>
